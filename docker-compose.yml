services:
  # 1. Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-manager-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - /var/www/node_modules
      - build_assets:/var/www/public/build
    networks:
      - app-network

  # 2. Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: file-manager-nginx
    restart: unless-stopped
    ports:
      - "8111:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - build_assets:/var/www/public/build
    networks:
      - app-network

  # 3. Database (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: file-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: file_manager
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  # 4. Queue Worker (Xử lý xóa file hết hạn)
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: file-manager-worker
  #   restart: unless-stopped
  #   command: php artisan queue:work --verbose --tries=3 --timeout=90
  #   volumes:
  #     - .:/var/www
  #   networks:
  #     - app-network

  # 5. Scheduler (Quét file hết hạn mỗi phút)
  # scheduler:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: file-manager-scheduler
  #   restart: unless-stopped
  #   command: php artisan schedule:work
  #   volumes:
  #     - .:/var/www
  #   networks:
  #     - app-network

  onlyoffice:
    image: onlyoffice/documentserver:9.3
    container_name: file-manager-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in .env}
      JWT_IN_BODY: "true"
      # Laravel's signed URLs are served by webserver on the private Docker network.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_logs:/var/log/onlyoffice
    shm_size: '256mb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  build_assets:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_logs:
